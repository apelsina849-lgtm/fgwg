          python -c "import gzip,pathlib; pathlib.Path('mega_upgrade_patch.py').write_bytes(gzip.decompress(pathlib.Path('mega_upgrade_patch.py.gz').read_bytes()))"
          python mega_upgrade_patch.py
          if($LASTEXITCODE-ne 0){ exit $LASTEXITCODE }

      - name: Static audit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cp=[Text.Encoding]::GetEncoding(1251)
          $s=[IO.File]::ReadAllText((Resolve-Path 'bundle/gamemodes/west.pwn'),$cp)
          $need=@(
            '#define MAX_ADMIN_LEVEL                 (8)',
            '#define ROLE_YOUTUBE                    (22)',
            '#define ROLE_TIKTOK                     (23)',
            'PC_RegAlias("jetpack", "jp")',
            'CMD:makeadmin(playerid,params[])',
