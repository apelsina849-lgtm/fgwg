          s = s.replace("ADMIN8-FD2-MAKEADMIN-20260925", "ADMIN8-FD2-MAKEADMIN-SETCMD-FIX-20260925", 1)

          p.write_bytes(s.replace("\n", "\r\n").encode("cp1251"))
