      - name: Fix makeadmin messages and setcmd revoke priority
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py = @'
          from pathlib import Path

          p = Path(r"bundle/gamemodes/west.pwn")
          s = p.read_bytes().decode("cp1251").replace("\r\n", "\n")

          old_guard = 'if(!IsMainOwner(playerid) && PlayerInfo[playerid][pFull] < 2) return SendClientMessage(playerid, COLOR_GRAD1, "Команда /makeadmin доступна с Full Access 2.");'
          new_guard = '''if(PlayerInfo[playerid][aiCMDaccess][CMD_setadmin] == '2')
              return SendClientMessage(playerid, COLOR_GRAD1, "{FF6666}[SETCMD] {FFFFFF}Доступ к /makeadmin у вас забран.");
