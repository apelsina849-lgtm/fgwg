          replacements = {
              '#define PAGE_SITE \t\t"vk.com/center_gtasa"': '#define PAGE_SITE \t\t"oldsamprp.samp.date"',
              '#define PAGE_VK\t\t\t"vk.com/center_gtasa"': '#define PAGE_VK\t\t\t"@mysterminion"',
