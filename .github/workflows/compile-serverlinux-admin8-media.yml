            'CRPFamilyBattleStart()',
            'CRPFamilyBattleFinish()',
            'CRPFamilyRefreshTag(playerid)',
            'CRPFamilyBattleOnDeath(playerid, killerid)',
            'family_pro',
            'CRPFamilyBattlePoints',
            'CRPFamilyCaptures',
            'CMD:familytop',
            'CMD:famdeposit',
            'CMD:famupgrade',
            'CMD:famhome',
            'CMD:famcar',
            'GangZoneFlashForPlayer',
            'Игрок %s был убит и потерял',
            'одержала победу и получила',
            'CMD:f(playerid, params[])',
            'for(new f = 1; f < CRP_MAX_FAMILIES; f++)',
            'CMD:famaddcar(playerid, params[])',
            'CMD:famparking(playerid, params[])',
            'CMD:fambuyapt(playerid, params[])',
            'DIALOG_CRP_FAMILY_ELEVATOR',
            '#define CRP_FAMILY_APT_PRICE (100)',
            'CMD:atune(playerid, params[])',
            'CMD:apaintjob(playerid, params[])',
            'CMD:acarcolor(playerid, params[])',
            'CMD:acleartune(playerid, params[])',
            'CRPSeedWorldContent',
            'CRPLoadCoreDatabaseTables',
            'Idlewood Pizza Stack',
            'CRPHouseHasGarage',
            'family_vehicles',
            'family_apartments',
            'cTune[playerid][carnumber][14]);',
            'CRPFamilyVehicleAddFromPersonal',
            'SELECT * FROM `mayor`',
            'LoadDItems',
            'CMD:uval(playerid, params[])',
            'for(new level = 1; level <= MAX_ADMIN_LEVEL; level++)',
            '8 LVL = все бывшие права 8-12 LVL',
            'case ROLE_YOUTUBE: format(output, size, "YouTube")',
            'case ROLE_TIKTOK: format(output, size, "TikTok")',
            'CMD:build(playerid, params[])',
            'ADMIN8-FAMILY-V2-WORLD-TUNING-20260925',
            'stock ApplyCRPRemovedBuildings(playerid)',
            'GetPlayerIp(playerid, PlayerInfo[playerid][pIP], 16)',
            'CRPMapRemovalsApplied',
            'CRPMobileSafeUI',
            'GetPlayerVersion(playerid, crpClientVersion, sizeof(crpClientVersion))',
            'auth-dialog rows=%d client=%s',
            'registration-dialog-sent',
            'dialog-response id=2 response=%d mode=%d inputlen=%d',
            'registration-complete',
            'CRP_MOBILE_CI_SERIAL_1',
            'CRP_MOBILE_CI_SERIAL_2',
            'CRP_MOBILE_CI_SERIAL_3',
            '3952314F524834355456464955525858554F3353',
            'SetPVarInt(playerid, "CRPMobileClient", crpIsMobile ? 1 : 0);',
            'mobile-registration-dialog-sent',
            'pc-registration-dialog-sent',
            'mobile-login-dialog-sent',
            'pc-login-dialog-sent',
            '{FFFFFF}%s[%d]\t{%s}%s\n'
          )
          foreach($x in $need){ if(-not $s.Contains($x)){ throw "Missing patch marker: $x" } }
          if($s -match '\[pAdmin\].*(?:<|>|==|!=)\s*(?:9|10|11|12)\b'){ throw 'Legacy 9-12 pAdmin check remains' }
          if($s.Contains('if(!IsPlayerConnected(playerid) || !IsMainOwner(playerid)) return 1;')){ throw 'Owner-only SetAdmin callback remains' }
          if($s.Contains('Владелец %s установил вам')){ throw 'Old makeadmin target wording remains' }
          if(-not $s.Contains("PlayerInfo[playerid][aiCMDaccess][CMD_setadmin] == '2'")){ throw 'SETCMD revoke guard missing from makeadmin' }
          Write-Host 'STATIC AUDIT OK'

      - name: Compile west.pwn with bundled Pawn compiler
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-Location bundle
          New-Item -ItemType Directory -Path build -Force | Out-Null
          $compiler = Join-Path $PWD '_compiler\pawncc.exe'
          $output = 'build\west-admin8.amx'
          $proc = Start-Process -FilePath $compiler -ArgumentList @('gamemodes\west.pwn','-i_compiler\include',('-o'+$output)) -WorkingDirectory $PWD -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput 'build\compiler-out.log' -RedirectStandardError 'build\compiler-errors.log'
          $log = (Get-Content 'build\compiler-out.log' -Raw) + (Get-Content 'build\compiler-errors.log' -Raw)
          Set-Content 'build\compile.log' $log
          Write-Host $log
          if($proc.ExitCode -notin 0,2 -or $log -match '(?im)\berror\s+[0-9]+:' -or -not (Test-Path -LiteralPath $output)){ throw 'Pawn compilation failed' }
          $bytes=[IO.File]::ReadAllBytes((Resolve-Path $output))
          if($bytes.Length -lt 56 -or [BitConverter]::ToUInt16($bytes,4) -ne 0xF1E0 -or [BitConverter]::ToUInt32($bytes,0) -ne $bytes.Length){ throw 'Invalid AMX' }
          Copy-Item $output 'west.amx' -Force
          Get-FileHash 'west.amx' -Algorithm SHA256 | Format-List

      - name: Upload compiled admin8 build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SERVER_LINUX_FAMILY_V2_WORLD_TUNING_COMPILED
          path: |
            bundle/west.amx
            bundle/gamemodes/west.pwn
            bundle/build/compile.log
            bundle/build/compiler-out.log
            bundle/build/compiler-errors.log
          if-no-files-found: error
