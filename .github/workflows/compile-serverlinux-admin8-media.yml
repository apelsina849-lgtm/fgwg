              '#define PAGE_FORUM\t\t"vk.com/center_gtasa"': '#define PAGE_FORUM\t\t"oldsamprp.samp.date"',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f"Brand macro not found: {old}")
