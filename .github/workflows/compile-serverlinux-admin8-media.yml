          {
              if(CRPFamilyTagCreated[playerid])
              {
                  Delete3DTextLabel(CRPFamilyTag[playerid]);
                  CRPFamilyTagCreated[playerid] = false;
              }
              return 1;
          }
          
          stock CRPFamilyRefreshTag(playerid)
          {
              CRPFamilyDestroyTag(playerid);
              if(!IsPlayerConnected(playerid)) return 1;
          
              new fam = PlayerInfo[playerid][pFamily];
              if(fam <= 0 || fam >= CRP_MAX_FAMILIES) return 1;
              if(!strlen(family_info[fam][f_name])) return 1;
          
              new text[48];
              format(text, sizeof(text), "%s", family_info[fam][f_name]);
              CRPFamilyTag[playerid] = Create3DTextLabel(text, CRPFamilyColor(fam), 0.0, 0.0, 0.0, 25.0, -1, 1);
              Attach3DTextLabelToPlayer(CRPFamilyTag[playerid], playerid, 0.0, 0.0, 0.55);
              CRPFamilyTagCreated[playerid] = true;
              return 1;
          }
          
          stock CRPFamilyRefreshTagsForFamily(familyid)
          {
              foreach(Player, i)
              {
                  if(PlayerInfo[i][pFamily] == familyid) CRPFamilyRefreshTag(i);
              }
              return 1;
          }
          
          stock CRPFamilyResetPlayerRuntime(playerid)
          {
              CRPFamilyDestroyTag(playerid);
              CRPFamilyBattlePlayerPoints[playerid] = 0;
              if(CRPFamilyBattleHudCreated[playerid])
              {
                  PlayerTextDrawDestroy(playerid, CRPFamilyBattleHud[playerid][0]);
                  PlayerTextDrawDestroy(playerid, CRPFamilyBattleHud[playerid][1]);
                  CRPFamilyBattleHudCreated[playerid] = false;
              }
              return 1;
          }
          
          stock CRPFamilyBroadcastAll(color, const message[])
          {
              foreach(Player, i)
              {
                  if(PlayerInfo[i][pFamily] > 0) SendClientMessage(i, color, message);
              }
              return 1;
          }
          
          stock CRPFamilyBroadcast(familyid, color, const message[])
          {
              foreach(Player, i)
              {
                  if(PlayerInfo[i][pFamily] == familyid) SendClientMessage(i, color, message);
              }
              return 1;
          }
          
          stock CRPFamilyProInit()
          {
              mysql_query(connects, "CREATE TABLE IF NOT EXISTS `family_pro` (`fam_id` INT NOT NULL, `battle_points` INT NOT NULL DEFAULT 0, `captures` INT NOT NULL DEFAULT 0, `level` INT NOT NULL DEFAULT 1, `bank` INT NOT NULL DEFAULT 0, PRIMARY KEY (`fam_id`)) ENGINE=InnoDB DEFAULT CHARSET=cp1251 COLLATE=cp1251_general_ci", false);
          
              mysql_query(connects,
                  "INSERT IGNORE INTO `family_pro` (`fam_id`) SELECT `fam_id` FROM `family_system`", false);
          
              mysql_function_query(connects, "SELECT * FROM `family_pro`", true, "CRPLoadFamilyPro", "");
              return 1;
          }
          
          public CRPLoadFamilyPro()
          {
              new rows, fields;
              cache_get_data(rows, fields);
          
              for(new i = 0; i < rows; i++)
              {
                  new fam = cache_get_field_content_int(i, "fam_id");
                  if(fam <= 0 || fam >= CRP_MAX_FAMILIES) continue;
          
                  CRPFamilyBattlePoints[fam] = cache_get_field_content_int(i, "battle_points");
                  CRPFamilyCaptures[fam] = cache_get_field_content_int(i, "captures");
                  CRPFamilyLevel[fam] = cache_get_field_content_int(i, "level");
                  CRPFamilyBank[fam] = cache_get_field_content_int(i, "bank");
                  if(CRPFamilyLevel[fam] < 1) CRPFamilyLevel[fam] = 1;
                  if(CRPFamilyLevel[fam] > 5) CRPFamilyLevel[fam] = 5;
              }
              printf("[FAMILY-PRO] Loaded %d family progression rows.", rows);
              return 1;
          }
          
          stock CRPFamilyEnsureRow(familyid)
          {
              if(familyid <= 0 || familyid >= CRP_MAX_FAMILIES) return 0;
              new query[128];
              format(query, sizeof(query), "INSERT IGNORE INTO `family_pro` (`fam_id`) VALUES ('%d')", familyid);
              mysql_function_query(connects, query, false, "", "");
              if(CRPFamilyLevel[familyid] < 1) CRPFamilyLevel[familyid] = 1;
              return 1;
          }
          
          stock CRPFamilySave(familyid)
          {
              if(familyid <= 0 || familyid >= CRP_MAX_FAMILIES) return 0;
              CRPFamilyEnsureRow(familyid);
          
              new query[256];
              format(query, sizeof(query),
                  "UPDATE `family_pro` SET `battle_points`='%d', `captures`='%d', `level`='%d', `bank`='%d' WHERE `fam_id`='%d'",
                  CRPFamilyBattlePoints[familyid], CRPFamilyCaptures[familyid],
                  CRPFamilyLevel[familyid], CRPFamilyBank[familyid], familyid);
              mysql_function_query(connects, query, false, "", "");
              return 1;
          }
          
          stock CRPFamilyVehicleSlots(familyid)
          {
              new level = CRPFamilyLevel[familyid];
              if(level < 1) level = 1;
              if(level > 5) level = 5;
              return level * 2;
          }
          
          stock CRPFamilyUpgradeCost(familyid)
          {
              switch(CRPFamilyLevel[familyid])
              {
                  case 1: return 500000;
                  case 2: return 1500000;
                  case 3: return 3000000;
                  case 4: return 5000000;
              }
              return 0;
          }
          
          stock CRPFamilyUpgradeCaptureReq(familyid)
          {
              switch(CRPFamilyLevel[familyid])
              {
                  case 1: return 0;
                  case 2: return 2;
                  case 3: return 5;
                  case 4: return 10;
              }
              return 0;
          }
          
          stock CRPIsFamilyOwner(playerid)
          {
              new fam = PlayerInfo[playerid][pFamily];
              if(fam <= 0 || fam >= CRP_MAX_FAMILIES) return 0;
              return !strcmp(PlayerInfo[playerid][pNames], family_info[fam][f_creator], true);
          }
          
          stock CRPFamilyShowUpgrade(playerid)
          {
              new fam = PlayerInfo[playerid][pFamily];
              if(fam <= 0) return SendClientMessage(playerid, -1, "Вы не состоите в семье.");
          
              if(CRPFamilyLevel[fam] < 1) CRPFamilyLevel[fam] = 1;
          
              new text[512], cost = CRPFamilyUpgradeCost(fam), req = CRPFamilyUpgradeCaptureReq(fam);
              if(CRPFamilyLevel[fam] >= 5)
              {
                  format(text, sizeof(text), "{FFFFFF}Семья: {FFD700}%s\n{FFFFFF}Уровень: {7CFC00}5/5\n{FFFFFF}Очки битв: {7CFC00}%d\n{FFFFFF}Победы: {7CFC00}%d\n{FFFFFF}Семейный банк: {7CFC00}%d вирт\n{FFFFFF}Автопарк: {7CFC00}%d машин\n\n{FFD700}Максимальный уровень семьи уже достигнут.",
                      family_info[fam][f_name], CRPFamilyBattlePoints[fam], CRPFamilyCaptures[fam],
                      CRPFamilyBank[fam], CRPFamilyVehicleSlots(fam));
                  return ShowPlayerDialog(playerid, DIALOG_CRP_FAMILY_UPGRADE, DIALOG_STYLE_MSGBOX,
                      "{FFD700}Прокачка семьи", text, "Закрыть", "");
              }
          
              format(text, sizeof(text), "{FFFFFF}Семья: {FFD700}%s\n{FFFFFF}Уровень: {7CFC00}%d/5\n{FFFFFF}Очки битв: {7CFC00}%d\n{FFFFFF}Победы: {7CFC00}%d\n{FFFFFF}Семейный банк: {7CFC00}%d вирт\n{FFFFFF}Автопарк: {7CFC00}%d машин\n\n{FFFFFF}Следующий уровень: {FFD700}%d\n{FFFFFF}Стоимость: {7CFC00}%d вирт\n{FFFFFF}Нужно побед в битвах семей: {7CFC00}%d",
                  family_info[fam][f_name], CRPFamilyLevel[fam], CRPFamilyBattlePoints[fam],
                  CRPFamilyCaptures[fam], CRPFamilyBank[fam], CRPFamilyVehicleSlots(fam),
                  CRPFamilyLevel[fam] + 1, cost, req);
          
              return ShowPlayerDialog(playerid, DIALOG_CRP_FAMILY_UPGRADE, DIALOG_STYLE_MSGBOX,
                  "{FFD700}Прокачка семьи", text, "Улучшить", "Назад");
          }
          
          stock CRPFamilyUpgrade(playerid)
          {
              new fam = PlayerInfo[playerid][pFamily];
              if(fam <= 0) return SendClientMessage(playerid, -1, "Вы не состоите в семье.");
              if(!CRPIsFamilyOwner(playerid)) return SendClientMessage(playerid, -1, "Прокачивать семью может только её создатель.");
              if(CRPFamilyLevel[fam] >= 5) return SendClientMessage(playerid, -1, "У семьи уже максимальный уровень.");
          
              new cost = CRPFamilyUpgradeCost(fam);
              new req = CRPFamilyUpgradeCaptureReq(fam);
              if(CRPFamilyCaptures[fam] < req)
                  return SendMes(playerid, -1, "Для следующего уровня нужно минимум %d побед в битвах семей.", req);
              if(CRPFamilyBank[fam] < cost)
                  return SendMes(playerid, -1, "В семейном банке недостаточно денег. Нужно: %d вирт.", cost);
          
              CRPFamilyBank[fam] -= cost;
              CRPFamilyLevel[fam]++;
              CRPFamilySave(fam);
          
              new msg[180];
              format(msg, sizeof(msg), "{FFD700}[СЕМЬЯ] {FFFFFF}Семья %s улучшена до {7CFC00}%d уровня{FFFFFF}. Автопарк: %d машин.",
                  family_info[fam][f_name], CRPFamilyLevel[fam], CRPFamilyVehicleSlots(fam));
              CRPFamilyBroadcast(fam, -1, msg);
              return 1;
          }
          
          stock CRPFamilyDeposit(playerid, amount)
          {
              new fam = PlayerInfo[playerid][pFamily];
              if(fam <= 0) return SendClientMessage(playerid, -1, "Вы не состоите в семье.");
              if(amount < 1000 || amount > 50000000) return SendClientMessage(playerid, -1, "Сумма пополнения: от 1.000 до 50.000.000 вирт.");
              if(PlayerInfo[playerid][pCash] < amount) return SendClientMessage(playerid, -1, "У вас недостаточно денег.");
          
              if(CRPFamilyBank[fam] > 2000000000 - amount)
                  return SendClientMessage(playerid, -1, "Семейный банк переполнен.");
          
              PlayerInfo[playerid][pCash] -= amount;
              GivePlayerMoney(playerid, -amount);
              CRPFamilyBank[fam] += amount;
              CRPFamilySave(fam);
          
              new query[160];
              format(query, sizeof(query), "UPDATE `accounts` SET `pCash`='%d' WHERE `pID`='%d' LIMIT 1",
                  PlayerInfo[playerid][pCash], PlayerInfo[playerid][pID]);
              mysql_function_query(connects, query, false, "", "");
          
              new msg[180];
              format(msg, sizeof(msg), "{FFD700}[СЕМЬЯ] {FFFFFF}%s пополнил семейный банк на {7CFC00}%d вирт{FFFFFF}. Баланс: %d вирт.",
                  PlayerInfo[playerid][pNames], amount, CRPFamilyBank[fam]);
              CRPFamilyBroadcast(fam, -1, msg);
              return 1;
          }
          
          stock CRPFamilyShowTop(playerid)
          {
              new text[1400];
              strcat(text, "№\tСемья\tОчки\tПобеды\tLVL\n");
          
              new used[CRP_MAX_FAMILIES];
              new place = 1;
          
              while(place <= 15)
              {
                  new best = 0;
                  for(new f = 1; f <= family_count && f < CRP_MAX_FAMILIES; f++)
                  {
                      if(used[f] || !strlen(family_info[f][f_name])) continue;
                      if(best == 0
                          || CRPFamilyBattlePoints[f] > CRPFamilyBattlePoints[best]
                          || (CRPFamilyBattlePoints[f] == CRPFamilyBattlePoints[best] && CRPFamilyCaptures[f] > CRPFamilyCaptures[best]))
                      {
                          best = f;
                      }
                  }
          
                  if(best == 0) break;
                  used[best] = 1;
          
                  new line[100];
                  format(line, sizeof(line), "%d\t%s\t%d\t%d\t%d\n",
                      place, family_info[best][f_name], CRPFamilyBattlePoints[best],
                      CRPFamilyCaptures[best], CRPFamilyLevel[best] < 1 ? 1 : CRPFamilyLevel[best]);
                  strcat(text, line);
                  place++;
              }
          
              if(place == 1) strcat(text, "-\tНет семей\t0\t0\t1\n");
              return ShowPlayerDialog(playerid, DIALOG_CRP_FAMILY_TOP, DIALOG_STYLE_TABLIST_HEADERS,
                  "{FFD700}Топ семей", text, "Закрыть", "");
          }
          
          stock CRPFamilyApartmentInterior(familyid)
          {
              if(CRPFamilyLevel[familyid] >= 5) return 5;
              if(CRPFamilyLevel[familyid] >= 3) return 15;
              return 5;
          }
          
          stock CRPFamilyApartmentPos(familyid, &Float:x, &Float:y, &Float:z)
          {
              if(CRPFamilyLevel[familyid] >= 5)
              {
                  x = 1267.8407; y = -776.9587; z = 1091.9063;
              }
              else if(CRPFamilyLevel[familyid] >= 3)
              {
                  x = 295.1391; y = 1473.3719; z = 1080.2578;
              }
              else
              {
                  x = 2233.6919; y = -1112.8107; z = 1050.8828;
              }
              return 1;
          }
          
          stock CRPFamilyEnterApartment(playerid)
          {
              new fam = PlayerInfo[playerid][pFamily];
              if(fam <= 0) return SendClientMessage(playerid, -1, "Вы не состоите в семье.");
          
              if(!IsPlayerInRangeOfPoint(playerid, 7.0, 1299.1859, -801.4249, 84.1406))
              {
                  SetPlayerCheckpoint(playerid, 1299.1859, -801.4249, 84.1406, 4.0);
                  return SendClientMessage(playerid, -1, "{FFD700}[СЕМЬЯ] {FFFFFF}На карте отмечен вход в семейную резиденцию. Приедьте туда и повторите /famhome.");
              }
          
              DisablePlayerCheckpoint(playerid);
              new Float:x, Float:y, Float:z;
              CRPFamilyApartmentPos(fam, x, y, z);
          
              SetPlayerInterior(playerid, CRPFamilyApartmentInterior(fam));
              SetPlayerVirtualWorld(playerid, 6000 + fam);
              SetPlayerPos(playerid, x, y, z);
              SetPVarInt(playerid, "CRPFamilyApartment", fam);
              SendMes(playerid, -1, "{FFD700}[СЕМЬЯ] {FFFFFF}Вы вошли в семейную квартиру. Уровень семьи: %d.", CRPFamilyLevel[fam]);
              return 1;
          }
          
          stock CRPFamilyExitApartment(playerid)
          {
              if(!GetPVarInt(playerid, "CRPFamilyApartment"))
                  return SendClientMessage(playerid, -1, "Вы не находитесь в семейной квартире.");
          
              DeletePVar(playerid, "CRPFamilyApartment");
              SetPlayerInterior(playerid, 0);
              SetPlayerVirtualWorld(playerid, 0);
              SetPlayerPos(playerid, 1299.1859, -804.0, 84.1406);
              return 1;
          }
          
          stock CRPFamilyActiveVehicleCount(familyid)
          {
              new count;
              for(new v = 1; v < MAX_VEHICLES; v++)
              {
                  if(CRPFamilyVehicleFamily[v] == familyid) count++;
              }
              return count;
          }
          
          stock CRPFamilyGarageModelByList(level, listitem)
          {
              new idx = 0;
              if(listitem == idx++) return 492;
              if(listitem == idx++) return 468;
              if(level >= 2 && listitem == idx++) return 560;
              if(level >= 3 && listitem == idx++) return 579;
              if(level >= 4 && listitem == idx++) return 541;
              if(level >= 5 && listitem == idx++) return 411;
              return 0;
          }
          
          stock CRPFamilyShowGarage(playerid)
          {
              new fam = PlayerInfo[playerid][pFamily];
              if(fam <= 0) return SendClientMessage(playerid, -1, "Вы не состоите в семье.");
          
              if(!IsPlayerInRangeOfPoint(playerid, 40.0, 1299.1859, -801.4249, 84.1406))
              {
                  SetPlayerCheckpoint(playerid, 1299.1859, -801.4249, 84.1406, 4.0);
                  return SendClientMessage(playerid, -1, "{FFD700}[СЕМЬЯ] {FFFFFF}На карте отмечен семейный автопарк. Приедьте туда и повторите /famcar.");
              }
          
              new list[512];
              strcat(list, "Greenwood\tLVL 1\n");
              strcat(list, "Sanchez\tLVL 1\n");
              if(CRPFamilyLevel[fam] >= 2) strcat(list, "Sultan\tLVL 2\n");
              if(CRPFamilyLevel[fam] >= 3) strcat(list, "Huntley\tLVL 3\n");
              if(CRPFamilyLevel[fam] >= 4) strcat(list, "Bullet\tLVL 4\n");
              if(CRPFamilyLevel[fam] >= 5) strcat(list, "Infernus\tLVL 5\n");
          
              new title[96];
              format(title, sizeof(title), "{FFD700}Автопарк семьи | %d/%d машин",
                  CRPFamilyActiveVehicleCount(fam), CRPFamilyVehicleSlots(fam));
              return ShowPlayerDialog(playerid, DIALOG_CRP_FAMILY_GARAGE, DIALOG_STYLE_TABLIST,
                  title, list, "Создать", "Назад");
          }
          
          stock CRPFamilySpawnGarageVehicle(playerid, listitem)
          {
              new fam = PlayerInfo[playerid][pFamily];
              if(fam <= 0) return 0;
          
              if(!IsPlayerInRangeOfPoint(playerid, 40.0, 1299.1859, -801.4249, 84.1406))
                  return SendClientMessage(playerid, -1, "Вы должны находиться у семейного автопарка.");
          
              new slots = CRPFamilyVehicleSlots(fam);
              new active = CRPFamilyActiveVehicleCount(fam);
              if(active >= slots) return SendMes(playerid, -1, "Автопарк заполнен: %d/%d машин.", active, slots);
          
              new model = CRPFamilyGarageModelByList(CRPFamilyLevel[fam], listitem);
              if(!model) return SendClientMessage(playerid, -1, "Эта машина пока не доступна вашей семье.");
          
              static const Float:spawnPos[][4] =
              {
                  {1281.0, -816.0, 83.0, 0.0},
                  {1286.0, -816.0, 83.0, 0.0},
                  {1291.0, -816.0, 83.0, 0.0},
                  {1296.0, -816.0, 83.0, 0.0},
                  {1301.0, -816.0, 83.0, 0.0},
                  {1306.0, -816.0, 83.0, 0.0}
              };
          
              new slot = active % sizeof(spawnPos);
              new color = CRPFamilyVehicleColor(fam);
              new vehicleid = CreateVehicleEx(model,
                  spawnPos[slot][0], spawnPos[slot][1], spawnPos[slot][2], spawnPos[slot][3],
                  color, color, 600, 0);
          
              if(vehicleid <= 0 || vehicleid >= MAX_VEHICLES)
                  return SendClientMessage(playerid, -1, "Не удалось создать семейный транспорт.");
          
              CRPFamilyVehicleFamily[vehicleid] = fam;
              Fuell[vehicleid] = 100.0;
          
              new msg[160];
              format(msg, sizeof(msg), "{FFD700}[СЕМЬЯ] {FFFFFF}%s создал транспорт семьи (model %d). Автопарк: %d/%d.",
                  PlayerInfo[playerid][pNames], model, active + 1, slots);
              CRPFamilyBroadcast(fam, -1, msg);
              return 1;
          }
          
          stock bool:CRPFamilyBattleIsInZone(playerid)
          {
              if(!CRPFamilyBattleActive || CRPFamilyBattleLocation < 0) return false;
              if(GetPlayerVirtualWorld(playerid) != 0 || GetPlayerInterior(playerid) != 0) return false;
          
              new Float:x, Float:y, Float:z;
              GetPlayerPos(playerid, x, y, z);
              return (
                  x >= CRPFamilyBattleLocations[CRPFamilyBattleLocation][crp_fb_minx]
                  && x <= CRPFamilyBattleLocations[CRPFamilyBattleLocation][crp_fb_maxx]
                  && y >= CRPFamilyBattleLocations[CRPFamilyBattleLocation][crp_fb_miny]
                  && y <= CRPFamilyBattleLocations[CRPFamilyBattleLocation][crp_fb_maxy]
              );
          }
          
          stock CRPFamilyBattleDestroyHud(playerid)
          {
              if(!CRPFamilyBattleHudCreated[playerid]) return 1;
              PlayerTextDrawDestroy(playerid, CRPFamilyBattleHud[playerid][0]);
              PlayerTextDrawDestroy(playerid, CRPFamilyBattleHud[playerid][1]);
              CRPFamilyBattleHudCreated[playerid] = false;
              return 1;
          }
          
          stock CRPFamilyBattleCreateHud(playerid)
          {
              if(CRPFamilyBattleHudCreated[playerid]) return 1;
              if(PlayerInfo[playerid][pFamily] <= 0) return 1;
          
              CRPFamilyBattleHud[playerid][0] = CreatePlayerTextDraw(playerid, 490.0, 315.0, "Ваши очки: 0");
              PlayerTextDrawFont(playerid, CRPFamilyBattleHud[playerid][0], 1);
              PlayerTextDrawLetterSize(playerid, CRPFamilyBattleHud[playerid][0], 0.24, 1.05);
              PlayerTextDrawColor(playerid, CRPFamilyBattleHud[playerid][0], 0xFFFFFFFF);
              PlayerTextDrawSetOutline(playerid, CRPFamilyBattleHud[playerid][0], 1);
              PlayerTextDrawBackgroundColor(playerid, CRPFamilyBattleHud[playerid][0], 0x00000099);
              PlayerTextDrawShow(playerid, CRPFamilyBattleHud[playerid][0]);
          
              CRPFamilyBattleHud[playerid][1] = CreatePlayerTextDraw(playerid, 490.0, 329.0, "Очки семьи: 0");
              PlayerTextDrawFont(playerid, CRPFamilyBattleHud[playerid][1], 1);
              PlayerTextDrawLetterSize(playerid, CRPFamilyBattleHud[playerid][1], 0.24, 1.05);
              PlayerTextDrawColor(playerid, CRPFamilyBattleHud[playerid][1], 0xFFD700FF);
              PlayerTextDrawSetOutline(playerid, CRPFamilyBattleHud[playerid][1], 1);
              PlayerTextDrawBackgroundColor(playerid, CRPFamilyBattleHud[playerid][1], 0x00000099);
              PlayerTextDrawShow(playerid, CRPFamilyBattleHud[playerid][1]);
          
              CRPFamilyBattleHudCreated[playerid] = true;
              return 1;
          }
          
          stock CRPFamilyBattleUpdateHud(playerid)
          {
              if(!CRPFamilyBattleActive || PlayerInfo[playerid][pFamily] <= 0)
                  return CRPFamilyBattleDestroyHud(playerid);
          
              CRPFamilyBattleCreateHud(playerid);
          
              new fam = PlayerInfo[playerid][pFamily];
              new text[64];
              format(text, sizeof(text), "Ваши очки: %d", CRPFamilyBattlePlayerPoints[playerid]);
              PlayerTextDrawSetString(playerid, CRPFamilyBattleHud[playerid][0], text);
              format(text, sizeof(text), "Очки семьи: %d", CRPFamilyBattleRoundPoints[fam]);
              PlayerTextDrawSetString(playerid, CRPFamilyBattleHud[playerid][1], text);
              return 1;
          }
          
          stock CRPFamilyBattleAttachPlayer(playerid)
          {
              if(!CRPFamilyBattleActive || PlayerInfo[playerid][pFamily] <= 0) return 1;
              if(CRPFamilyBattleZone >= 0)
              {
                  GangZoneShowForPlayer(playerid, CRPFamilyBattleZone, 0xFF000055);
                  GangZoneFlashForPlayer(playerid, CRPFamilyBattleZone, 0xFF0000CC);
              }
              CRPFamilyBattleCreateHud(playerid);
              CRPFamilyBattleUpdateHud(playerid);
              return 1;
          }
          
          stock CRPFamilyBattleDropPlayerPoints(playerid)
          {
              new fam = PlayerInfo[playerid][pFamily];
              new points = CRPFamilyBattlePlayerPoints[playerid];
              if(points <= 0) return 1;
          
              if(fam > 0 && fam < CRP_MAX_FAMILIES)
              {
                  CRPFamilyBattleRoundPoints[fam] -= points;
                  if(CRPFamilyBattleRoundPoints[fam] < 0) CRPFamilyBattleRoundPoints[fam] = 0;
              }
              CRPFamilyBattlePlayerPoints[playerid] = 0;
              return 1;
          }
          
          stock CRPFamilyBattleOnDeath(playerid, killerid)
          {
              if(!CRPFamilyBattleActive) return 1;
          
              new victimFamily = PlayerInfo[playerid][pFamily];
              if(victimFamily <= 0 || victimFamily >= CRP_MAX_FAMILIES) return 1;
          
              new lost = CRPFamilyBattlePlayerPoints[playerid];
              if(lost <= 0) return 1;
          
              new bool:deathInZone = CRPFamilyBattleIsInZone(playerid);
              CRPFamilyBattleRoundPoints[victimFamily] -= lost;
              if(CRPFamilyBattleRoundPoints[victimFamily] < 0) CRPFamilyBattleRoundPoints[victimFamily] = 0;
              CRPFamilyBattlePlayerPoints[playerid] = 0;
          
              new bool:transferred = false;
              if(deathInZone && killerid != INVALID_PLAYER_ID && killerid != playerid && IsPlayerConnected(killerid))
              {
                  new killerFamily = PlayerInfo[killerid][pFamily];
                  if(killerFamily > 0 && killerFamily < CRP_MAX_FAMILIES
                      && killerFamily != victimFamily
                      && CRPFamilyBattleIsInZone(killerid))
                  {
                      CRPFamilyBattlePlayerPoints[killerid] += lost;
                      CRPFamilyBattleRoundPoints[killerFamily] += lost;
                      transferred = true;
                      CRPFamilyBattleUpdateHud(killerid);
                      SendMes(killerid, 0xFFD700FF, "[БИТВА СЕМЕЙ] Вы забрали у %s %d очков.", PlayerInfo[playerid][pNames], lost);
                  }
              }
          
              new msg[200];
              format(msg, sizeof(msg), "{FF4444}[БИТВА СЕМЕЙ] {FFFFFF}Игрок %s был убит и потерял {FF4444}%d{FFFFFF} очков%s",
                  PlayerInfo[playerid][pNames], lost, transferred ? (".") : (" — очки сгорели."));
              CRPFamilyBroadcastAll(-1, msg);
              CRPFamilyBattleUpdateHud(playerid);
              return 1;
          }
          
          stock CRPFamilyBattleStart()
          {
              if(CRPFamilyBattleActive) return 0;
          
              CRPFamilyBattleActive = true;
              CRPFamilyBattleLocation = random(sizeof(CRPFamilyBattleLocations));
          
              for(new f = 0; f < CRP_MAX_FAMILIES; f++) CRPFamilyBattleRoundPoints[f] = 0;
          
              foreach(Player, i)
              {
                  CRPFamilyBattlePlayerPoints[i] = 0;
                  CRPFamilyBattleDestroyHud(i);
              }
          
              CRPFamilyBattleZone = GangZoneCreate(
                  CRPFamilyBattleLocations[CRPFamilyBattleLocation][crp_fb_minx],
                  CRPFamilyBattleLocations[CRPFamilyBattleLocation][crp_fb_miny],
                  CRPFamilyBattleLocations[CRPFamilyBattleLocation][crp_fb_maxx],
                  CRPFamilyBattleLocations[CRPFamilyBattleLocation][crp_fb_maxy]
              );
          
              new msg[220];
              format(msg, sizeof(msg), "{FF0000}[БИТВА СЕМЕЙ] {FFFFFF}Битва семей началась! Локация: {FFD700}%s{FFFFFF}. Красный мигающий квадрат отмечен на карте.",
                  CRPFamilyBattleLocations[CRPFamilyBattleLocation][crp_fb_name]);
              CRPFamilyBroadcastAll(-1, msg);
              CRPFamilyBroadcastAll(-1, "{FF0000}[БИТВА СЕМЕЙ] {FFFFFF}Находитесь внутри зоны и получайте +1 очко каждую секунду. Битва закончится через 10 минут.");
          
              foreach(Player, i)
              {
                  if(PlayerInfo[i][pFamily] > 0) CRPFamilyBattleAttachPlayer(i);
              }
          
              if(CRPFamilyBattleEndTimer != -1) KillTimer(CRPFamilyBattleEndTimer);
              CRPFamilyBattleEndTimer = SetTimer("CRPFamilyBattleFinish", 600000, false);
              return 1;
          }
          
          public CRPFamilyBattleFinish()
          {
              if(!CRPFamilyBattleActive) return 1;
              CRPFamilyBattleEndTimer = -1;
          
              new winner = 0, bestPoints = 0, bool:tie = false;
              for(new f = 1; f <= family_count && f < CRP_MAX_FAMILIES; f++)
              {
                  if(CRPFamilyBattleRoundPoints[f] > 0)
                  {
                      CRPFamilyBattlePoints[f] += CRPFamilyBattleRoundPoints[f];
                      CRPFamilyEnsureRow(f);
                  }
          
                  if(CRPFamilyBattleRoundPoints[f] > bestPoints)
                  {
                      winner = f;
                      bestPoints = CRPFamilyBattleRoundPoints[f];
                      tie = false;
                  }
                  else if(CRPFamilyBattleRoundPoints[f] == bestPoints && bestPoints > 0)
                  {
                      tie = true;
                  }
              }
          
              if(winner > 0 && bestPoints > 0 && !tie)
              {
                  CRPFamilyCaptures[winner]++;
                  new msg[220];
                  format(msg, sizeof(msg), "{FF0000}[БИТВА СЕМЕЙ] {FFFFFF}Семья {FFD700}%s{FFFFFF} одержала победу и получила {7CFC00}%d{FFFFFF} очков.",
                      family_info[winner][f_name], bestPoints);
                  CRPFamilyBroadcastAll(-1, msg);
              }
              else if(tie)
              {
                  CRPFamilyBroadcastAll(-1, "{FF0000}[БИТВА СЕМЕЙ] {FFFFFF}Битва завершилась ничьей. Очки участников сохранены, захват не засчитан.");
              }
              else
              {
                  CRPFamilyBroadcastAll(-1, "{FF0000}[БИТВА СЕМЕЙ] {FFFFFF}Битва завершилась. Ни одна семья не набрала очков.");
              }
          
              for(new f = 1; f <= family_count && f < CRP_MAX_FAMILIES; f++)
              {
                  if(CRPFamilyBattleRoundPoints[f] > 0 || f == winner) CRPFamilySave(f);
                  CRPFamilyBattleRoundPoints[f] = 0;
              }
          
              foreach(Player, i)
              {
                  if(CRPFamilyBattleZone >= 0)
                  {
                      GangZoneStopFlashForPlayer(i, CRPFamilyBattleZone);
                      GangZoneHideForPlayer(i, CRPFamilyBattleZone);
                  }
                  CRPFamilyBattlePlayerPoints[i] = 0;
                  CRPFamilyBattleDestroyHud(i);
              }
          
              if(CRPFamilyBattleZone >= 0)
              {
                  GangZoneDestroy(CRPFamilyBattleZone);
                  CRPFamilyBattleZone = -1;
              }
          
              CRPFamilyBattleLocation = -1;
              CRPFamilyBattleActive = false;
              return 1;
          }
          
          public CRPFamilyBattlePulse()
          {
              new hour, minute, second;
              gettime(hour, minute, second);
          
              if(!CRPFamilyBattleActive && minute == 30 && hour >= 10 && hour <= 23)
              {
                  new key = hour * 60 + minute;
                  if(key != CRPFamilyBattleLastStartKey)
                  {
                      CRPFamilyBattleLastStartKey = key;
                      CRPFamilyBattleStart();
                  }
              }
          
              if(!CRPFamilyBattleActive) return 1;
          
              foreach(Player, i)
              {
                  new fam = PlayerInfo[i][pFamily];
                  if(fam <= 0 || fam >= CRP_MAX_FAMILIES) continue;
          
                  if(!CRPFamilyBattleHudCreated[i]) CRPFamilyBattleAttachPlayer(i);
          
                  if(CRPFamilyBattleIsInZone(i))
                  {
                      CRPFamilyBattlePlayerPoints[i]++;
                      CRPFamilyBattleRoundPoints[fam]++;
                  }
                  CRPFamilyBattleUpdateHud(i);
              }
              return 1;
          }
          
          stock CRPFamilyBattleStatus(playerid)
          {
              if(PlayerInfo[playerid][pFamily] <= 0)
                  return SendClientMessage(playerid, -1, "Вы не состоите в семье.");
          
              if(!CRPFamilyBattleActive)
                  return SendClientMessage(playerid, -1, "{FF0000}[БИТВА СЕМЕЙ] {FFFFFF}Сейчас битва семей не проводится. Старт каждый час в XX:30 с 10:30 до 23:30.");
          
              new fam = PlayerInfo[playerid][pFamily];
              new msg[220];
              format(msg, sizeof(msg), "{FF0000}[БИТВА СЕМЕЙ] {FFFFFF}Локация: {FFD700}%s{FFFFFF} | Ваши очки: %d | Очки семьи: %d",
                  CRPFamilyBattleLocations[CRPFamilyBattleLocation][crp_fb_name],
                  CRPFamilyBattlePlayerPoints[playerid], CRPFamilyBattleRoundPoints[fam]);
              SendClientMessage(playerid, -1, msg);
              CRPFamilyBattleAttachPlayer(playerid);
              return 1;
          }
          
