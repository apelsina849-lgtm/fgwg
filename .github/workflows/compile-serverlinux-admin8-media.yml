      - name: Apply CenterRolePlay contacts and server branding
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py = @'
          from pathlib import Path
          import re

          p = Path(r"bundle/gamemodes/west.pwn")
          s = p.read_bytes().decode("cp1251").replace("\r\n", "\n")

          replacements = {
              '#define PAGE_SITE \t\t"vk.com/center_gtasa"': '#define PAGE_SITE \t\t"oldsamprp.samp.date"',
              '#define PAGE_VK\t\t\t"vk.com/center_gtasa"': '#define PAGE_VK\t\t\t"@mysterminion"',
              '#define PAGE_VK_FREE\t"vk.com/center_gtasa"': '#define PAGE_VK_FREE\t"@mysterminion"',
              '#define PAGE_FORUM\t\t"vk.com/center_gtasa"': '#define PAGE_FORUM\t\t"oldsamprp.samp.date"',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f"Brand macro not found: {old}")
              s = s.replace(old, new, 1)

          # Replace all old runtime VK links/handles, but keep source-code credit comments intact.
          out = []
          for line in s.splitlines(True):
              stripped = line.lstrip()
              if not stripped.startswith("//"):
                  line = re.sub(r'(?i)(?:https?://)?(?:www\.)?vk\.(?:com|ru)/[A-Za-z0-9_.-]+', '@mysterminion', line)
              out.append(line)
          s = "".join(out)

          # Version marker for easy host verification.
          s = s.replace("ADMIN8-DUAL-AUTH-PC-MOBILE-20260925", "ADMIN8-DUAL-AUTH-CONTACTS-20260925")

          p.write_bytes(s.replace("\n", "\r\n").encode("cp1251"))
          print("CONTACTS/SERVER BRANDING PATCH APPLIED")
          '@
          Set-Content -LiteralPath 'contacts_branding_patch.py' -Value $py -Encoding UTF8
          python contacts_branding_patch.py
          if($LASTEXITCODE-ne 0){ exit $LASTEXITCODE }


      - name: Fix mobile client detection signatures
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py = @'
          from pathlib import Path
          import re

          p = Path(r"bundle/gamemodes/west.pwn")
          s = p.read_bytes().decode("cp1251").replace("\r\n", "\n")

          # Support multiple Android SA-MP launchers. The second signature is the
          # exact GPCI observed from Lucifer_Belov's phone in the production log.
          if '#define CRP_MOBILE_CI_SERIAL "ED40ED0E8089CC44C08EE9580F4C8C44EE8EE990"' not in s:
              raise SystemExit("Primary mobile signature define not found")

          s = s.replace(
              '#define CRP_MOBILE_CI_SERIAL "ED40ED0E8089CC44C08EE9580F4C8C44EE8EE990"',
              '#define CRP_MOBILE_CI_SERIAL_1 "ED40ED0E8089CC44C08EE9580F4C8C44EE8EE990"\n'
              '#define CRP_MOBILE_CI_SERIAL_2 "3952314F524834355456464955525858554F3353"\n'
              '#define CRP_MOBILE_CI_SERIAL_3 "4458465947454248504B51425156534F4738384F"',
              1
          )

          old = 'new bool:crpIsMobile = !strcmp(crpCiSerial, CRP_MOBILE_CI_SERIAL, true);'
          new = (
              'new bool:crpIsMobile = (!strcmp(crpCiSerial, CRP_MOBILE_CI_SERIAL_1, true) || '
              '!strcmp(crpCiSerial, CRP_MOBILE_CI_SERIAL_2, true) || '
              '!strcmp(crpCiSerial, CRP_MOBILE_CI_SERIAL_3, true));'
          )
          if old not in s:
              raise SystemExit("Old single-signature detector not found")
          s = s.replace(old, new, 1)

          s = s.replace("ADMIN8-DUAL-AUTH-CONTACTS-20260925", "ADMIN8-DUAL-AUTH-MOBILE-DETECT-20260925")

          p.write_bytes(s.replace("\n", "\r\n").encode("cp1251"))
          print("MOBILE SIGNATURE DETECTION FIX APPLIED")
          '@
          Set-Content -LiteralPath 'mobile_signature_fix.py' -Value $py -Encoding UTF8
          python mobile_signature_fix.py
          if($LASTEXITCODE-ne 0){ exit $LASTEXITCODE }


