              SendMes(playerid, COLOR_LIGHTGREEN, "Вы изменили %s[%d] уровень администратора на %d.", PlayerInfo[targetid][pNames], targetid, lvl);
              format(stringer1, sizeof(stringer1), "Администратор %s изменил %s уровень администратора на %d.", PlayerInfo[playerid][pNames], PlayerInfo[targetid][pNames], lvl);
              SendAdminMessage(COLOR_LIGHTGREEN, stringer1);'''
          if old_online not in s:
              raise SystemExit("online makeadmin messages not found")
          s = s.replace(old_online, new_online, 1)

          old_offline_target = 'SendMes(i, COLOR_LIGHTGREEN, "Владелец %s установил вам %d уровень администратора.", PlayerInfo[playerid][pNames], lvl);'
          new_offline_target = 'SendMes(i, COLOR_LIGHTGREEN, "Администратор %s изменил ваш уровень администратора на %d.", PlayerInfo[playerid][pNames], lvl);'
          if old_offline_target not in s:
              raise SystemExit("offline target message not found")
