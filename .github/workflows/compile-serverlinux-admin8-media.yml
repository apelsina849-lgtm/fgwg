              SendAdminMessage(COLOR_LIGHTGREEN, stringer1);
              SendMes(playerid, COLOR_LIGHTGREEN, "[MAKEADMIN] %s: установлен %d уровень.", realName, lvl);'''
          new_offline_admin = '''format(stringer1, sizeof(stringer1), "Администратор %s изменил %s уровень администратора на %d.", PlayerInfo[playerid][pNames], realName, lvl);
              SendAdminMessage(COLOR_LIGHTGREEN, stringer1);
              SendMes(playerid, COLOR_LIGHTGREEN, "Вы изменили %s уровень администратора на %d.", realName, lvl);'''
          if old_offline_admin not in s:
