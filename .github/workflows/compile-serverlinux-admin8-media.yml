name: Compile SERVER_LINUX ADMIN8 MAKEADMIN SETCMD FIX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compile-serverlinux-admin8-media.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ef6a622a26b52acc153c8c7366ac516ee32e2d44

      - name: Reconstruct previous proven ADMIN12 bundle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $b64 = (Get-Content -Raw 'serverlinux_admin12/payload.b64') -replace '\s',''
          [IO.File]::WriteAllBytes('bundle.tar.xz',[Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Force bundle | Out-Null
          tar -C bundle -xf bundle.tar.xz
          if(!(Test-Path 'bundle/gamemodes/west.pwn')){ throw 'west.pwn missing' }
          if(!(Test-Path 'bundle/_compiler/pawncc.exe')){ throw 'pawncc.exe missing' }

      - name: Apply ADMIN8, makeadmin/uval and media-role patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $patchB64 = @'
          
          '@
          Set-Content -LiteralPath 'patch_admin8.b64' -Value $patchB64 -NoNewline
          python -c "import base64,lzma,pathlib; pathlib.Path('patch_admin8.py').write_bytes(lzma.decompress(base64.b64decode(pathlib.Path('patch_admin8.b64').read_text())))"
          python patch_admin8.py bundle/gamemodes/west.pwn
          if($LASTEXITCODE-ne 0){ exit $LASTEXITCODE }


      - name: Apply DOSTUP player ID and build-marker hotfix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py = @'
          from pathlib import Path

          p = Path(r"bundle/gamemodes/west.pwn")
          s = p.read_bytes().decode("cp1251").replace("\r\n", "\n")

          old = """\t\tGetStaffRoleColor(role, roleColor, sizeof(roleColor));
          \t\tGetStaffRoleName(role, displayRole, sizeof(displayRole));
          \t\tformat(line, sizeof(line), "{FFFFFF}%s\\t{%s}%s\\n", targetName, roleColor, displayRole);
          \t\tif(strlen(dialog) + strlen(line) >= sizeof(dialog) - 1) break;"""

          new = """\t\tGetStaffRoleColor(role, roleColor, sizeof(roleColor));
          \t\tGetStaffRoleName(role, displayRole, sizeof(displayRole));
          \t\tnew onlineId = GetOnlinePlayerByAccountID(accountId);
          \t\tif(onlineId != INVALID_PLAYER_ID)
          \t\t\tformat(line, sizeof(line), "{FFFFFF}%s[%d]\\t{%s}%s\\n", targetName, onlineId, roleColor, displayRole);
          \t\telse
          \t\t\tformat(line, sizeof(line), "{AFAFAF}%s[OFF]\\t{%s}%s\\n", targetName, roleColor, displayRole);
          \t\tif(strlen(dialog) + strlen(line) >= sizeof(dialog) - 1) break;"""

          if old not in s:
              raise SystemExit("DOSTUP list target not found")
          s = s.replace(old, new, 1)

          anchor = "CMD:dostup(playerid, params[])\n"
          build_cmd = """CMD:build(playerid, params[])
          {
          \t#pragma unused params
          \tSendClientMessage(playerid, 0x33CC66FF, "[CRP BUILD] ADMIN8-DOSTUP-ID-MEDIA-HOTFIX-20260925");
          \treturn 1;
          }

          """
          if anchor not in s:
              raise SystemExit("CMD:dostup anchor not found")
          s = s.replace(anchor, build_cmd + anchor, 1)

          p.write_bytes(s.replace("\n", "\r\n").encode("cp1251"))
          print("DOSTUP ID/MEDIA hotfix applied")
          '@
          Set-Content -LiteralPath 'dostup_id_hotfix.py' -Value $py -Encoding UTF8
          python dostup_id_hotfix.py
          if($LASTEXITCODE-ne 0){ exit $LASTEXITCODE }


      - name: Apply join stability and sscanf overflow hotfix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py = @'
          from pathlib import Path
          import re

          p = Path(r"bundle/gamemodes/west.pwn")
          raw = p.read_bytes()
          s = raw.decode("cp1251").replace("\r\n", "\n")

          # Unused geolocation include performs an HTTP lookup and parses its response
          # through the ancient sscanf plugin on every join. It is not used elsewhere.
          if "#include <player_geolocation>\n" not in s:
              raise SystemExit("player_geolocation include not found")
          s = s.replace("#include <player_geolocation>\n", "", 1)

          # Locate the real OnPlayerConnect body.
          m = re.search(r"public OnPlayerConnect\(playerid\)\s*\{", s)
          if not m:
              raise SystemExit("OnPlayerConnect not found")
          brace = s.find("{", m.start())
          depth = 0
          end = None
          for i in range(brace, len(s)):
              if s[i] == "{":
                  depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit("OnPlayerConnect end not found")

          opc = s[m.start():end]
          lines = opc.splitlines(True)
          removals = [line for line in lines if "RemoveBuildingForPlayer(playerid," in line]
          if len(removals) != 435:
              raise SystemExit(f"Expected 435 RemoveBuildingForPlayer calls, got {len(removals)}")
          opc = "".join(line for line in lines if "RemoveBuildingForPlayer(playerid," not in line)

          # Restore the real current IP. The original line was inside a large block comment.
          name_line = "GetPlayerName(playerid, PlayerInfo[playerid][pNames], 24);"
          idx = opc.find(name_line)
          if idx < 0:
              raise SystemExit("GetPlayerName join line not found")
          idx += len(name_line)
          opc = opc[:idx] + "\n\tGetPlayerIp(playerid, PlayerInfo[playerid][pIP], 16);" + opc[idx:]

          s = s[:m.start()] + opc + s[end:]

          # Move the 435 map-removal RPCs out of the connection handshake.
          apply_func = (
              "stock ApplyCRPRemovedBuildings(playerid)\n"
              "{\n" +
              "".join(removals) +
              "\treturn 1;\n"
              "}\n\n"
          )
          pos = s.find("public OnPlayerConnect(playerid)")
          if pos < 0:
              raise SystemExit("OnPlayerConnect insertion point not found")
          s = s[:pos] + apply_func + s[pos:]

          # Apply the map only after successful authentication, before spawning.
          gs = s.find("stock GoServer(playerid)")
          if gs < 0:
              raise SystemExit("GoServer not found")
          marker = "\tgPlayerLogged[playerid] = 1;"
          pos = s.find(marker, gs)
          if pos < 0:
              raise SystemExit("GoServer login marker not found")
          call = (
              "\tif(!GetPVarInt(playerid, \"CRPMapRemovalsApplied\"))\n"
              "\t{\n"
              "\t\tApplyCRPRemovedBuildings(playerid);\n"
              "\t\tSetPVarInt(playerid, \"CRPMapRemovalsApplied\", 1);\n"
              "\t}\n"
          )
          s = s[:pos] + call + s[pos:]

          # Add lightweight diagnostics to distinguish server kick from client timeout.
          dc = re.search(r"public OnPlayerDisconnect\(playerid,\s*reason\)\s*\{", s)
          if dc:
              bp = s.find("{", dc.start()) + 1
              diag = '\n\tprintf("[JOIN-DIAG] %s[%d] disconnect reason=%d logged=%d", PlayerInfo[playerid][pNames], playerid, reason, gPlayerLogged[playerid]);'
              s = s[:bp] + diag + s[bp:]

          p.write_bytes(s.replace("\n", "\r\n").encode("cp1251"))
          print("JOIN STABILITY HOTFIX APPLIED")
          '@
          Set-Content -LiteralPath 'join_stability_hotfix.py' -Value $py -Encoding UTF8
          python join_stability_hotfix.py
          if($LASTEXITCODE-ne 0){ exit $LASTEXITCODE }


      - name: Apply mobile client login compatibility hotfix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py = @'
          from pathlib import Path
          import re

          p = Path(r"bundle/gamemodes/west.pwn")
          s = p.read_bytes().decode("cp1251").replace("\r\n", "\n")

          def get_block(text, signature):
              start = text.find(signature)
              if start < 0:
                  raise SystemExit(f"Block not found: {signature}")
              brace = text.find("{", start)
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return start, i + 1, text[start:i+1]
              raise SystemExit(f"Unclosed block: {signature}")

          # Keep pre-auth traffic minimal for Android/mobile SA-MP clients.
          start, end, opc = get_block(s, "public OnPlayerConnect(playerid)")
          for target in (
              "\tCreateTextDraw(playerid);\n",
              "    CreateTextDraw(playerid);\n",
              "\tfor(new i = 1;i<=TOTALGZ;i++) GangZoneShowForPlayer(playerid,GZInfo[i][id],GetGangZoneColor(i));\n",
              "    for(new i = 1;i<=TOTALGZ;i++) GangZoneShowForPlayer(playerid,GZInfo[i][id],GetGangZoneColor(i));\n",
              "\tResetPlayerWeapons(playerid);\n",
              "    ResetPlayerWeapons(playerid);\n",
              "    for(new i; i != 11; i++) TextDrawShowForPlayer(playerid, td_logo[i]);\n",
              "\tfor(new i; i != 11; i++) TextDrawShowForPlayer(playerid, td_logo[i]);\n",
          ):
              opc = opc.replace(target, "")

          # Log client version so mobile clients can be identified in server_log.
          name_line = "GetPlayerName(playerid, PlayerInfo[playerid][pNames], 24);"
          if "GetPlayerVersion(playerid" not in opc:
              pos = opc.find(name_line)
              if pos < 0:
                  raise SystemExit("GetPlayerName line missing")
              pos += len(name_line)
              diag = (
                  "\n\tnew crpClientVersion[32];"
                  "\n\tGetPlayerVersion(playerid, crpClientVersion, sizeof(crpClientVersion));"
                  "\n\tprintf(\"[JOIN-DIAG] %s[%d] client=%s\", PlayerInfo[playerid][pNames], playerid, crpClientVersion);"
              )
              opc = opc[:pos] + diag + opc[pos:]

          s = s[:start] + opc + s[end:]

          # The old gamemode preloaded dozens of animation libraries immediately
          # after showing the login dialog. This is unnecessary and is unstable
          # on several Android SA-MP clients.
          start, end, reg = get_block(s, "publics: OnPlayerRegCheck(playerid)")
          reg = reg.replace("\tPreloadAllAnims(playerid);\n", "")
          reg = reg.replace("\tClearAnimations(playerid);\n", "")
          if "[JOIN-DIAG] %s[%d] auth-dialog" not in reg:
              marker = "\tnew rows, fields;\n\tcache_get_data(rows, fields);"
              if marker not in reg:
                  raise SystemExit("OnPlayerRegCheck marker missing")
              rep = marker + (
                  "\n\tnew crpAuthVersion[32];"
                  "\n\tGetPlayerVersion(playerid, crpAuthVersion, sizeof(crpAuthVersion));"
                  "\n\tprintf(\"[JOIN-DIAG] %s[%d] auth-dialog rows=%d client=%s\", PlayerInfo[playerid][pNames], playerid, rows, crpAuthVersion);"
              )
              reg = reg.replace(marker, rep, 1)
          s = s[:start] + reg + s[end:]

          # Create/show UI and zones only after successful authentication.
          start, end, gs = get_block(s, "stock GoServer(playerid)")
          marker = "\tgPlayerLogged[playerid] = 1;"
          if marker not in gs:
              raise SystemExit("GoServer logged marker missing")
          if "CRPMobileSafeUI" not in gs:
              delayed = (
                  "\t// CRPMobileSafeUI: heavy client RPCs are delayed until login.\n"
                  "\tCreateTextDraw(playerid);\n"
                  "\tfor(new crpLogo = 0; crpLogo != 11; crpLogo++) TextDrawShowForPlayer(playerid, td_logo[crpLogo]);\n"
                  "\tfor(new crpGz = 1; crpGz <= TOTALGZ; crpGz++) GangZoneShowForPlayer(playerid, GZInfo[crpGz][id], GetGangZoneColor(crpGz));\n"
                  "\tResetPlayerWeapons(playerid);\n"
              )
              gs = gs.replace(marker, delayed + marker, 1)
          s = s[:start] + gs + s[end:]

          # Build marker for this exact mobile-safe binary.
          old = 'SendClientMessage(playerid, 0x33CC66FF, "[CRP BUILD] ADMIN8-DOSTUP-ID-MEDIA-HOTFIX-20260925");'
          new = 'SendClientMessage(playerid, 0x33CC66FF, "[CRP BUILD] ADMIN8-MOBILE-SAFE-LOGIN-20260925");'
          if old in s:
              s = s.replace(old, new, 1)
          elif "ADMIN8-MOBILE-SAFE-LOGIN-20260925" not in s:
              raise SystemExit("Build marker not found")

          p.write_bytes(s.replace("\n", "\r\n").encode("cp1251"))
          print("MOBILE LOGIN COMPATIBILITY HOTFIX APPLIED")
          '@
          Set-Content -LiteralPath 'mobile_login_hotfix.py' -Value $py -Encoding UTF8
          python mobile_login_hotfix.py
          if($LASTEXITCODE-ne 0){ exit $LASTEXITCODE }


      - name: Apply compact registration dialog hotfix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py = @'
          from pathlib import Path
          import re

          p = Path(r"bundle/gamemodes/west.pwn")
          s = p.read_bytes().decode("cp1251").replace("\r\n", "\n")

          def block(text, signature):
              start = text.find(signature)
              if start < 0:
                  raise SystemExit(f"Missing block: {signature}")
              brace = text.find("{", start)
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return start, i + 1
              raise SystemExit(f"Unclosed block: {signature}")

          # Replace the oversized new-account registration dialog with a compact one.
          a, b = block(s, "publics: OnPlayerRegCheck(playerid)")
          new_reg = r'''publics: OnPlayerRegCheck(playerid)
          {
              new rows, fields;
              cache_get_data(rows, fields);

              new crpAuthVersion[32];
              GetPlayerVersion(playerid, crpAuthVersion, sizeof(crpAuthVersion));
              printf("[JOIN-DIAG] %s[%d] auth-dialog rows=%d client=%s", PlayerInfo[playerid][pNames], playerid, rows, crpAuthVersion);

              if(rows)
              {
                  new string[192];
                  cache_get_field_content(0, "password", PlayerInfo[playerid][pPassword], connects, 65);
                  cache_get_field_content(0, "salt", PlayerInfo[playerid][pSalt], connects, 11);
                  format(string, sizeof(string), "Аккаунт: %s\nВведите пароль:", PlayerInfo[playerid][pNames]);
                  ShowPlayerDialog(playerid, 1, DIALOG_STYLE_PASSWORD, "Center RolePlay | Вход", string, "Войти", "Выход");
                  printf("[JOIN-DIAG] %s[%d] login-dialog-sent", PlayerInfo[playerid][pNames], playerid);
              }
              else
              {
                  PlayerRegMode[playerid] = 2;
                  ShowPlayerDialog(playerid, 2, DIALOG_STYLE_INPUT,
                      "Center RolePlay | Регистрация",
                      "Придумайте пароль (6-64 символа):",
                      "Далее", "Выход");
                  printf("[JOIN-DIAG] %s[%d] registration-dialog-sent", PlayerInfo[playerid][pNames], playerid);
              }
              return true;
          }'''
          s = s[:a] + new_reg + s[b:]

          # Replace only registration case 2 in OnDialogResponse.
          od = s.find("public OnDialogResponse(playerid, dialogid, response, listitem, inputtext[])")
          if od < 0:
              raise SystemExit("OnDialogResponse not found")
          m = re.search(r'(?m)^\s*case\s+2:\s*\n\s*\{', s[od:])
          if not m:
              raise SystemExit("Registration case 2 not found")
          cs = od + m.start()
          brace = s.find("{", cs)
          depth = 0
          ce = None
          for i in range(brace, len(s)):
              if s[i] == "{":
                  depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      ce = i + 1
                      break
          if ce is None:
              raise SystemExit("Registration case 2 unclosed")

          new_case = r'''        case 2:
              {
                  printf("[JOIN-DIAG] %s[%d] dialog-response id=2 response=%d mode=%d inputlen=%d",
                      PlayerInfo[playerid][pNames], playerid, response, PlayerRegMode[playerid], strlen(inputtext));

                  if(!response) return KickEx(playerid);

                  if(PlayerRegMode[playerid] == 2)
                  {
                      if(strlen(inputtext) < 6 || strlen(inputtext) > 64)
                      {
                          ShowPlayerDialog(playerid, 2, DIALOG_STYLE_INPUT,
                              "Center RolePlay | Регистрация",
                              "Пароль должен содержать 6-64 символа.",
                              "Далее", "Выход");
                          return 1;
                      }

                      strmid(CheckPass[playerid], inputtext, 0, strlen(inputtext), 65);
                      PlayerRegMode[playerid] = 3;
                      ShowPlayerDialog(playerid, 2, DIALOG_STYLE_LIST,
                          "Регистрация | Пол",
                          "Мужской\nЖенский",
                          "Далее", "Назад");
                      return 1;
                  }

                  if(PlayerRegMode[playerid] == 3)
                  {
                      PlayerInfo[playerid][pSex] = listitem + 1;
                      PlayerRegMode[playerid] = 4;
                      ShowPlayerDialog(playerid, 2, DIALOG_STYLE_LIST,
                          "Регистрация | Национальность",
                          "Американец\nИтальянец\nНемец\nИспанец\nФранцуз\nРусский\nКитаец\nЯпонец",
                          "Далее", "Назад");
                      return 1;
                  }

                  if(PlayerRegMode[playerid] == 4)
                  {
                      PlayerInfo[playerid][pNational] = listitem + 1;
                      PlayerRegMode[playerid] = 5;
                      ShowPlayerDialog(playerid, 2, DIALOG_STYLE_INPUT,
                          "Регистрация | Возраст",
                          "Введите возраст персонажа: 15-90",
                          "Готово", "Назад");
                      return 1;
                  }

                  if(PlayerRegMode[playerid] == 5)
                  {
                      if(strval(inputtext) < 15 || strval(inputtext) > 90)
                      {
                          ShowPlayerDialog(playerid, 2, DIALOG_STYLE_INPUT,
                              "Регистрация | Возраст",
                              "Введите число от 15 до 90.",
                              "Готово", "Назад");
                          return 1;
                      }

                      PlayerInfo[playerid][pAge] = strval(inputtext);
                      PlayerInfo[playerid][pEmail][0] = EOS;
                      PlayerRegMode[playerid] = 0;
                      SetPVarInt(playerid, "Registration", 1);

                      SpawnPlayer(playerid);
                      SetPlayerVirtualWorldEx(playerid, playerid + 10);
                      SetPlayerInteriorEx(playerid, 0);

                      if(PlayerInfo[playerid][pSex] == 1)
                      {
                          new ran = random(7);
                          SetPlayerSkin(playerid, SkinMen[ran][0]);
                      }
                      else
                      {
                          new ran = random(5);
                          SetPlayerSkin(playerid, SkinMale[ran][0]);
                      }

                      TogglePlayerControllable(playerid, true);
                      PlayerInfo[playerid][pChar] = GetPlayerSkin(playerid);
                      PlayerRegisterMySQL(playerid);
                      printf("[JOIN-DIAG] %s[%d] registration-complete", PlayerInfo[playerid][pNames], playerid);
                      return 1;
                  }

                  PlayerRegMode[playerid] = 2;
                  ShowPlayerDialog(playerid, 2, DIALOG_STYLE_INPUT,
                      "Center RolePlay | Регистрация",
                      "Придумайте пароль (6-64 символа):",
                      "Далее", "Выход");
                  return 1;
              }'''
          s = s[:cs] + new_case + s[ce:]

          # Remove nonessential pre-auth RPCs/messages. Authentication dialog is now the first meaningful UI packet.
          a, b = block(s, "public OnPlayerConnect(playerid)")
          opc = s[a:b]
          opc_lines = []
          for line in opc.splitlines(True):
              if 'SendClientMessage(playerid, COLOR_WHITE,"Вы выиграли промокод' in line:
                  continue
              if 'SendClientMessage(playerid, COLOR_WHITE,"{FFCC66}Используйте команды' in line:
                  continue
              if 'SendClientMessage(playerid, COLOR_WHITE,"{ffff00}Выполняйте квесты' in line:
                  continue
              if re.search(r'\bSetPlayerArmour\(playerid,\s*0\);', line):
                  continue
              if re.search(r'\bSetPlayerColor\(playerid,\s*COLOR_WHITE\);', line):
                  continue
              opc_lines.append(line)
          s = s[:a] + "".join(opc_lines) + s[b:]

          # Camera setup is also delayed; some Android clients are fragile before the first dialog response.
          a, b = block(s, "publics: OnPlayerBanipCheck(playerid)")
          ban = s[a:b]
          ban = re.sub(r'\s*SetPlayerCameraPos\(playerid,[^;]+;\n', '\n', ban, count=1)
          ban = re.sub(r'\s*SetPlayerCameraLookAt\(playerid,[^;]+;\n', '\n', ban, count=1)
          s = s[:a] + ban + s[b:]

          # New build marker.
          s = s.replace("ADMIN8-MOBILE-SAFE-LOGIN-20260925", "ADMIN8-MOBILE-REG-COMPACT-20260925")

          p.write_bytes(s.replace("\n", "\r\n").encode("cp1251"))
          print("COMPACT REGISTRATION HOTFIX APPLIED")
          '@
          Set-Content -LiteralPath 'compact_registration_hotfix.py' -Value $py -Encoding UTF8
          python compact_registration_hotfix.py
          if($LASTEXITCODE-ne 0){ exit $LASTEXITCODE }


      - name: Apply dual PC/mobile authentication hotfix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py = @'
          from pathlib import Path
          import re

          p = Path(r"bundle/gamemodes/west.pwn")
          s = p.read_bytes().decode("cp1251").replace("\r\n", "\n")

          def get_block(text, signature):
              start = text.find(signature)
              if start < 0:
                  raise SystemExit(f"Block not found: {signature}")
              brace = text.find("{", start)
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return start, i + 1, text[start:i+1]
              raise SystemExit(f"Unclosed block: {signature}")

          # Built-in SA-MP GPCI native is used for mobile detection.
          if "native gpci(playerid, serial[], len);" not in s:
              insert_at = s.find("#include")
              if insert_at < 0:
                  raise SystemExit("include section not found")
              s = s[:insert_at] + 'native gpci(playerid, serial[], len);\n#define CRP_MOBILE_CI_SERIAL "ED40ED0E8089CC44C08EE9580F4C8C44EE8EE990"\n\n' + s[insert_at:]

          # Detect supported Android SA-MP mobile clients as soon as the player joins.
          a, b, opc = get_block(s, "public OnPlayerConnect(playerid)")
          if 'SetPVarInt(playerid, "CRPMobileClient"' not in opc:
              marker = "GetPlayerName(playerid, PlayerInfo[playerid][pNames], 24);"
              pos = opc.find(marker)
              if pos < 0:
                  raise SystemExit("OnPlayerConnect name marker missing")
              pos += len(marker)
              detect = r'''
              new crpCiSerial[41];
              gpci(playerid, crpCiSerial, sizeof(crpCiSerial));
              new bool:crpIsMobile = !strcmp(crpCiSerial, CRP_MOBILE_CI_SERIAL, true);
              SetPVarInt(playerid, "CRPMobileClient", crpIsMobile ? 1 : 0);
              printf("[JOIN-DIAG] %s[%d] device=%s ci=%s", PlayerInfo[playerid][pNames], playerid, crpIsMobile ? ("MOBILE") : ("PC"), crpCiSerial);
          '''
              opc = opc[:pos] + detect + opc[pos:]
              s = s[:a] + opc + s[b:]

          # Two independent authorization/registration presentations:
          # PC = the original full Center RolePlay flow.
          # Mobile = compact stable flow.
          a, b, _ = get_block(s, "publics: OnPlayerRegCheck(playerid)")
          dual_reg = r'''publics: OnPlayerRegCheck(playerid)
          {
              new rows, fields;
              cache_get_data(rows, fields);

              new crpAuthVersion[32];
              GetPlayerVersion(playerid, crpAuthVersion, sizeof(crpAuthVersion));
              new bool:crpMobile = (GetPVarInt(playerid, "CRPMobileClient") != 0);
              printf("[JOIN-DIAG] %s[%d] auth-dialog rows=%d client=%s device=%s",
                  PlayerInfo[playerid][pNames], playerid, rows, crpAuthVersion, crpMobile ? ("MOBILE") : ("PC"));

              if(rows)
              {
                  cache_get_field_content(0, "password", PlayerInfo[playerid][pPassword], connects, 65);
                  cache_get_field_content(0, "salt", PlayerInfo[playerid][pSalt], connects, 11);

                  if(crpMobile)
                  {
                      new string[192];
