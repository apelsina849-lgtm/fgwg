      - name: Add automatic chat giveaways
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py = @'
          from pathlib import Path

          p = Path(r"bundle/gamemodes/west.pwn")
          s = p.read_bytes().decode("cp1251").replace("\r\n", "\n")

          giveaway_block = r'''
          // =============================================================================
          // CENTER ROLE PLAY — automatic chat giveaways
          // Mostly Donate Coins; rare donate-ruble prizes are limited to 1-3 rubles.
          // A round stays active for exactly 5 minutes.
          // =============================================================================
          new bool:CRPGiveawayActive = false;
          new CRPGiveawayAnswer = 0;
          new CRPGiveawayRewardType = 0; // 0 = Donate Coins, 1 = donate rubles (pRub)
          new CRPGiveawayRewardAmount = 0;
          new CRPGiveawayExpireTimer = -1;
          new CRPGiveawayNextTimer = -1;
          
          forward CRPStartGiveaway();
          forward CRPEndGiveaway();
          
          stock bool:CRPIsExactInteger(const text[])
          {
              new len = strlen(text);
              if(len < 1 || len > 10) return false;
          
              new i = 0;
              if(text[0] == '-')
              {
                  if(len == 1) return false;
                  i = 1;
              }
          
              for(; i < len; i++)
              {
                  if(text[i] < '0' || text[i] > '9') return false;
              }
              return true;
          }
          
          stock CRPScheduleNextGiveaway()
          {
              if(CRPGiveawayNextTimer != -1)
              {
                  KillTimer(CRPGiveawayNextTimer);
                  CRPGiveawayNextTimer = -1;
              }
          
              // Next round in 10-20 minutes.
              CRPGiveawayNextTimer = SetTimer("CRPStartGiveaway", 600000 + random(600001), false);
              return 1;
          }
          
          stock CRPGiveawayBroadcast(const message[])
          {
              SendClientMessageToAll(0xFFD700FF, message);
              return 1;
          }
          
          public CRPStartGiveaway()
          {
              CRPGiveawayNextTimer = -1;
              if(CRPGiveawayActive) return 1;
          
              new a, b, c, step, kind;
              new msg[256];
          
              // About 90% of rounds reward Donate Coins; rubles are deliberately rare.
              if(random(100) < 90)
              {
                  static const coinRewards[] = {10, 15, 20, 25, 30, 50};
                  CRPGiveawayRewardType = 0;
                  CRPGiveawayRewardAmount = coinRewards[random(sizeof(coinRewards))];
              }
              else
              {
                  CRPGiveawayRewardType = 1;
                  CRPGiveawayRewardAmount = 1 + random(3); // strictly 1..3
              }
          
              kind = random(6);
              switch(kind)
              {
                  case 0:
                  {
                      a = 1 + random(50);
                      b = 1 + random(50);
                      CRPGiveawayAnswer = a + b;
                      format(msg, sizeof(msg), "{FFD700}[РОЗЫГРЫШ] {FFFFFF}Решите пример: {7CFC00}%d + %d{FFFFFF}.", a, b);
                  }
                  case 1:
                  {
                      a = 10 + random(90);
                      b = random(a + 1);
                      CRPGiveawayAnswer = a - b;
                      format(msg, sizeof(msg), "{FFD700}[РОЗЫГРЫШ] {FFFFFF}Решите пример: {7CFC00}%d - %d{FFFFFF}.", a, b);
                  }
                  case 2:
                  {
                      a = 2 + random(11);
                      b = 2 + random(11);
                      CRPGiveawayAnswer = a * b;
                      format(msg, sizeof(msg), "{FFD700}[РОЗЫГРЫШ] {FFFFFF}Решите пример: {7CFC00}%d x %d{FFFFFF}.", a, b);
                  }
                  case 3:
                  {
                      a = 5 + random(40);
                      b = 1 + random(20);
                      c = 1 + random(15);
                      CRPGiveawayAnswer = a + b - c;
                      format(msg, sizeof(msg), "{FFD700}[РОЗЫГРЫШ] {FFFFFF}Решите пример: {7CFC00}%d + %d - %d{FFFFFF}.", a, b, c);
                  }
                  case 4:
                  {
                      a = 1 + random(15);
                      b = 2 + random(8);
                      c = 1 + random(20);
                      CRPGiveawayAnswer = a * b + c;
                      format(msg, sizeof(msg), "{FFD700}[РОЗЫГРЫШ] {FFFFFF}Решите пример: {7CFC00}%d x %d + %d{FFFFFF}.", a, b, c);
                  }
                  case 5:
                  {
                      a = 1 + random(20);
                      step = 1 + random(9);
                      CRPGiveawayAnswer = a + step * 3;
                      format(msg, sizeof(msg), "{FFD700}[РОЗЫГРЫШ] {FFFFFF}Продолжите последовательность: {7CFC00}%d, %d, %d, ?{FFFFFF}.", a, a + step, a + step * 2);
                  }
              }
          
              CRPGiveawayActive = true;
              CRPGiveawayBroadcast(msg);
          
              if(CRPGiveawayRewardType == 0)
                  format(msg, sizeof(msg), "{FFD700}[РОЗЫГРЫШ] {FFFFFF}Первый правильный ответ в обычный чат получит {7CFC00}%d Donate Coins{FFFFFF}. У вас 5 минут!", CRPGiveawayRewardAmount);
              else
                  format(msg, sizeof(msg), "{FFD700}[РОЗЫГРЫШ] {FFFFFF}Первый правильный ответ в обычный чат получит {7CFC00}%d руб.{FFFFFF} У вас 5 минут!", CRPGiveawayRewardAmount);
          
              CRPGiveawayBroadcast(msg);
          
              if(CRPGiveawayExpireTimer != -1) KillTimer(CRPGiveawayExpireTimer);
              CRPGiveawayExpireTimer = SetTimer("CRPEndGiveaway", 300000, false);
              return 1;
          }
          
          public CRPEndGiveaway()
          {
              CRPGiveawayExpireTimer = -1;
              if(!CRPGiveawayActive) return 1;
          
              CRPGiveawayActive = false;
              CRPGiveawayBroadcast("{FFD700}[РОЗЫГРЫШ] {FFFFFF}Никто не победил в розыгрыше :(");
              CRPScheduleNextGiveaway();
              return 1;
          }
          
          stock CRPProcessGiveawayAnswer(playerid, const text[])
          {
              if(!CRPGiveawayActive) return 0;
              if(!CRPIsExactInteger(text)) return 0;
              if(strval(text) != CRPGiveawayAnswer) return 0;
          
              CRPGiveawayActive = false;
          
              if(CRPGiveawayExpireTimer != -1)
              {
                  KillTimer(CRPGiveawayExpireTimer);
                  CRPGiveawayExpireTimer = -1;
              }
          
              if(CRPGiveawayRewardType == 0)
              {
                  PlayerInfo[playerid][pDonatemoney2] += CRPGiveawayRewardAmount;
                  UpdatePlayerData(playerid, "pDonatemoney2", PlayerInfo[playerid][pDonatemoney2]);
              }
              else
              {
                  PlayerInfo[playerid][pRub] += CRPGiveawayRewardAmount;
                  UpdatePlayerData(playerid, "pRub", PlayerInfo[playerid][pRub]);
              }
          
              new msg[256];
              if(CRPGiveawayRewardType == 0)
                  format(msg, sizeof(msg), "{FFD700}[РОЗЫГРЫШ] {FFFFFF}Победитель {7CFC00}%s{FFFFFF} первым ввёл ответ {7CFC00}%d{FFFFFF} и получил {7CFC00}%d Donate Coins{FFFFFF}!", PlayerInfo[playerid][pNames], CRPGiveawayAnswer, CRPGiveawayRewardAmount);
              else
                  format(msg, sizeof(msg), "{FFD700}[РОЗЫГРЫШ] {FFFFFF}Победитель {7CFC00}%s{FFFFFF} первым ввёл ответ {7CFC00}%d{FFFFFF} и получил {7CFC00}%d руб.{FFFFFF}!", PlayerInfo[playerid][pNames], CRPGiveawayAnswer, CRPGiveawayRewardAmount);
          
              CRPGiveawayBroadcast(msg);
              CRPScheduleNextGiveaway();
              return 1;
          }
          '''

          marker = "public OnGameModeInit()"
          if marker not in s:
              raise SystemExit("OnGameModeInit marker not found")
          if "CENTER ROLE PLAY — automatic chat giveaways" not in s:
              s = s.replace(marker, giveaway_block + "\n" + marker, 1)

          timer_anchor = 'SetTimer("YaTop", 300,1);'
          if timer_anchor not in s:
              raise SystemExit("OnGameModeInit timer anchor not found")
          if 'SetTimer("CRPStartGiveaway"' not in s[s.find("public OnGameModeInit()"):s.find("public OnGameModeInit()")+5000]:
              s = s.replace(
                  timer_anchor,
                  timer_anchor + '\n\t// First automatic giveaway 3-6 minutes after server start.\n\tCRPGiveawayNextTimer = SetTimer("CRPStartGiveaway", 180000 + random(180001), false);',
                  1
              )

          text_anchor = '\tif(EmptyMessage(text)) return false;'
          if text_anchor not in s:
              raise SystemExit("OnPlayerText EmptyMessage anchor not found")
          if "CRPProcessGiveawayAnswer(playerid, text)" not in s:
              s = s.replace(
                  text_anchor,
                  text_anchor + '\n\t// Giveaway answers are entered as plain normal-chat messages, no command required.\n\tif(CRPProcessGiveawayAnswer(playerid, text)) return false;',
                  1
              )

          old_build = "ADMIN8-FD2-MAKEADMIN-SETCMD-FIX-20260925"
          new_build = "ADMIN8-CHAT-GIVEAWAYS-20260925"
          if old_build not in s:
              raise SystemExit("previous build marker not found")
          s = s.replace(old_build, new_build, 1)

          p.write_bytes(s.replace("\n", "\r\n").encode("cp1251"))
          print("AUTOMATIC CHAT GIVEAWAYS PATCH APPLIED")
          '@
          Set-Content -LiteralPath 'chat_giveaways_patch.py' -Value $py -Encoding UTF8
          python chat_giveaways_patch.py
          if($LASTEXITCODE-ne 0){ exit $LASTEXITCODE }


