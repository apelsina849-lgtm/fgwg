name: Compile OLDSAMPRP V3.7.0

on:
  push:
    branches:
      - oldsamprp-v370-compile-final
    paths-ignore:
      - 'compiled/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct V3.7.0 source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(
            'payload/current/chunk00',
            'payload/current/part00',
            'payload/current/part01',
            'payload/final/part02',
            'payload/final/p03_0',
            'payload/final/p03_1',
            'payload/final/p03_2',
            'payload/final/p03_3',
            'payload/current/part04',
            'payload/final/part05',
            'payload/current/part06',
            'payload/final/part07'
          )
          foreach ($p in $parts) { if (!(Test-Path $p)) { throw "Missing payload part: $p" } }
          $b64 = ($parts | ForEach-Object { [IO.File]::ReadAllText((Resolve-Path $_)) }) -join ''
          [IO.File]::WriteAllBytes('source.tar.xz', [Convert]::FromBase64String($b64))
          tar -xf source.tar.xz
          if (!(Test-Path 'server/source/gamemodes/oldsamprp.pwn')) { throw 'oldsamprp.pwn not reconstructed' }
          Write-Host "Source reconstructed: $((Get-Item 'server/source/gamemodes/oldsamprp.pwn').Length) bytes"

      - name: Download open.mp and Pawn dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/openmultiplayer/open.mp/releases/download/v1.5.8.3079/open.mp-win-x86.zip' -OutFile 'openmp.zip'
          Expand-Archive 'openmp.zip' 'openmp' -Force
          $pawncc = Get-ChildItem 'openmp' -Recurse -Filter 'pawncc.exe' | Select-Object -First 1
          if (!$pawncc) { throw 'pawncc.exe not found in open.mp archive' }
          $inc = Join-Path $pawncc.Directory.FullName 'include'
          New-Item -ItemType Directory -Force (Join-Path $inc 'oldsamprp') | Out-Null
          Copy-Item 'server/source/include/oldsamprp/*.inc' (Join-Path $inc 'oldsamprp') -Force

          Invoke-WebRequest 'https://github.com/pBlueG/SA-MP-MySQL/releases/download/R41-4/mysql-R41-4-win32.zip' -OutFile 'mysql.zip'
          Expand-Archive 'mysql.zip' 'mysql' -Force
          Invoke-WebRequest 'https://github.com/Y-Less/sscanf/releases/download/v2.13.8/sscanf-2.13.8-win32.zip' -OutFile 'sscanf.zip'
          Expand-Archive 'sscanf.zip' 'sscanf' -Force
          Invoke-WebRequest 'https://github.com/samp-incognito/samp-streamer-plugin/releases/download/v2.9.6/samp-streamer-plugin-2.9.6.zip' -OutFile 'streamer.zip'
          Expand-Archive 'streamer.zip' 'streamer' -Force
          Invoke-WebRequest 'https://raw.githubusercontent.com/lassir/bcrypt-samp/v2.2.3/pawn/bcrypt.inc' -OutFile (Join-Path $inc 'bcrypt.inc')

          function Copy-Include([string]$root, [string]$name) {
            $f = Get-ChildItem $root -Recurse -Filter $name | Select-Object -First 1
            if (!$f) { throw "Required include not found: $name" }
            Copy-Item $f.FullName (Join-Path $inc $name) -Force
          }
          Copy-Include 'mysql' 'a_mysql.inc'
          Copy-Include 'sscanf' 'sscanf2.inc'
          Copy-Include 'streamer' 'streamer.inc'

          "PAWNCC=$($pawncc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PAWNINC=$inc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Pawn compiler: $($pawncc.FullName)"

      - name: Compile oldsamprp.pwn
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force 'compiled' | Out-Null
          $outArg = '-o' + (Join-Path $PWD 'compiled/oldsamprp')
          $incArg = '-i' + $env:PAWNINC
          & $env:PAWNCC '.\server\source\gamemodes\oldsamprp.pwn' '-;+' '-(+' '-Z-' '-d3' '-O2' $incArg $outArg 2>&1 | Tee-Object -FilePath 'compiled/compile.log'
          $code = $LASTEXITCODE
          Write-Host "pawncc exit code: $code"
          if ($code -ne 0) { exit $code }
          if (!(Test-Path 'compiled/oldsamprp.amx')) { throw 'Compilation returned success but AMX is missing' }
          Write-Host "AMX size: $((Get-Item 'compiled/oldsamprp.amx').Length) bytes"

      - name: Encode compiled AMX for retrieval
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'compiled/b64' | Out-Null
          $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path 'compiled/oldsamprp.amx')))
          $chunkSize = 200000
          $index = 0
          for ($offset = 0; $offset -lt $b64.Length; $offset += $chunkSize) {
            $len = [Math]::Min($chunkSize, $b64.Length - $offset)
            $name = 'compiled/b64/chunk{0:D3}.txt' -f $index
            [IO.File]::WriteAllText($name, $b64.Substring($offset, $len))
            $index++
          }
          [IO.File]::WriteAllText('compiled/b64/manifest.txt', "chunks=$index`namx_bytes=$((Get-Item 'compiled/oldsamprp.amx').Length)`n")
          Write-Host "AMX base64 chunks: $index"

      - name: Publish compile output to branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compiled/compile.log compiled/b64
          git commit -m 'Publish V3.7.0 compiled AMX' || echo 'No output changes'
          git push origin HEAD:oldsamprp-v370-compile-final

      - name: Upload compiled artifact
        uses: actions/upload-artifact@v4
        with:
          name: OLDSAMPRP-V370-COMPILED
          path: |
            compiled/oldsamprp.amx
            compiled/compile.log
          if-no-files-found: error
