<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111d2c"><title>WORLD SHIFT Mobile</title><style>*{box-sizing:border-box}body{margin:0;background:#142235;color:white;font-family:system-ui;overflow:hidden;touch-action:none}canvas{display:block}#hud{position:fixed;top:12px;left:12px;background:#0b1829b8;padding:12px;border-radius:12px;pointer-events:none}#hud b{font-size:17px}#status{font-size:12px;color:#bcd5ff;margin-top:4px}button{border:1px solid #8bb8ff66;background:#193a61e8;color:white;border-radius:12px;padding:14px;font-weight:700;touch-action:manipulation}#actions{position:fixed;bottom:18px;right:14px;display:grid;gap:8px;width:135px}#stick{position:fixed;bottom:26px;left:24px;width:130px;height:130px;border:2px solid #ffffff77;border-radius:50%;background:#ffffff24;touch-action:none}#knob{position:absolute;width:54px;height:54px;left:38px;top:38px;border-radius:50%;background:#66c5ffad;border:2px solid white}#panel{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(340px,90vw);background:#101e34f5;padding:20px;border:1px solid #6e9fff;border-radius:18px;box-shadow:0 12px 45px #0009}#panel label{display:block;margin:18px 0}input{width:100%;accent-color:#68c4ff}#panel button{width:100%;margin-top:7px}#hint{position:fixed;top:14px;right:12px;font-size:11px;color:#e1edff;background:#0b1829aa;padding:8px;border-radius:9px;max-width:145px}#error{position:fixed;inset:0;background:#101e34;display:none;padding:30px;z-index:10}</style></head><body><div id="hud"><b>WORLD SHIFT <span style="color:#6ad9ff">ALPHA 0.2</span></b><div id="status">Энергия: 100% · Гравитация: 100%</div></div><div id="hint">Левый круг — движение<br>Справа — поворот камеры</div><div id="stick"><div id="knob"></div></div><div id="actions"><button id="jump">ПРЫЖОК</button><button id="core">SHIFT CORE</button><button id="reset">СБРОС SHIFT</button></div><div id="panel"><h2>⚡ SHIFT CORE</h2><label>Гравитация: <output id="gval">35%</output><input id="gravity" type="range" min="20" max="200" value="35"></label><label>Скорость: <output id="sval">150%</output><input id="speed" type="range" min="50" max="250" value="150"></label><button id="apply">АКТИВИРОВАТЬ</button><button id="close">ЗАКРЫТЬ</button></div><div id="error">Не удалось загрузить 3D-движок. Проверьте подключение к интернету и обновите страницу.</div><script type="module">
import * as THREE from 'https://esm.sh/three@0.169.0';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8cb7d3);scene.fog=new THREE.Fog(0x8cb7d3,40,95);const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,150);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xc7e7ff,0x4d6045,2.2));const sun=new THREE.DirectionalLight(0xffe6b2,2.2);sun.position.set(-12,24,14);scene.add(sun);
function box(x,y,z,w,h,d,color){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.85}));m.position.set(x,y,z);scene.add(m);return m}box(0,-1,0,40,2,40,0x4c8050);box(0,-2.5,0,37,1,37,0x63564b);for(let i=0;i<25;i++){let x=(i*13%35)-17,z=(i*23%35)-17;if(Math.abs(x)<4&&Math.abs(z)<4)continue;box(x,.6,z,.6,1.2,.6,0x795a3e);let tree=new THREE.Mesh(new THREE.ConeGeometry(1.7,3.4,6),new THREE.MeshStandardMaterial({color:i%2?0x2d7655:0x326a49}));tree.position.set(x,2.8,z);scene.add(tree)}for(let i=0;i<6;i++)box(i*4-10,.3,-8,2,.6,2,0x858f96);
let avatar=new THREE.Group();let body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,1.0,4,8),new THREE.MeshStandardMaterial({color:0x319af7,roughness:.65}));body.position.y=1;avatar.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.32,12,8),new THREE.MeshStandardMaterial({color:0xffcf9b}));head.position.y=1.85;avatar.add(head);scene.add(avatar);let pos=new THREE.Vector3(0,0,0),vy=0,yaw=0,pitch=.23,move={x:0,y:0},gravity=1,speed=1,energy=100,active=false,grounded=true;let last=performance.now();const status=document.querySelector('#status');function frame(t){let dt=Math.min((t-last)/1000,.05);last=t;let f=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,Math.sin(yaw));let dx=r.x*move.x+f.x*-move.y,dz=r.z*move.x+f.z*-move.y;let len=Math.hypot(dx,dz);if(len>1){dx/=len;dz/=len}pos.x=Math.max(-19.2,Math.min(19.2,pos.x+dx*6*speed*dt));pos.z=Math.max(-19.2,Math.min(19.2,pos.z+dz*6*speed*dt));vy-=19.6*gravity*dt;pos.y+=vy*dt;if(pos.y<=0){pos.y=0;vy=0;grounded=true}else grounded=false;avatar.position.copy(pos);avatar.rotation.y=yaw;if(active){energy=Math.max(0,energy-(2+Math.abs(1-gravity)*7+Math.abs(1-speed)*3)*dt);if(energy===0)reset()}else energy=Math.min(100,energy+9*dt);status.textContent=`Энергия: ${Math.round(energy)}% · Гравитация: ${Math.round(gravity*100)}% · Скорость: ${Math.round(speed*100)}%`;let offset=new THREE.Vector3(-Math.sin(yaw)*Math.cos(pitch)*7,2.6+Math.sin(pitch)*7,Math.cos(yaw)*Math.cos(pitch)*7);camera.position.copy(pos).add(offset);camera.lookAt(pos.x,pos.y+1.2,pos.z);renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
function reset(){active=false;gravity=1;speed=1}document.querySelector('#jump').onclick=()=>{if(grounded){vy=7/Math.sqrt(Math.max(.15,gravity));grounded=false}};document.querySelector('#core').onclick=()=>document.querySelector('#panel').style.display='block';document.querySelector('#close').onclick=()=>document.querySelector('#panel').style.display='none';document.querySelector('#reset').onclick=reset;document.querySelector('#apply').onclick=()=>{if(energy<5)return;gravity=Number(document.querySelector('#gravity').value)/100;speed=Number(document.querySelector('#speed').value)/100;active=true;document.querySelector('#panel').style.display='none'};for(let [a,b] of [['gravity','gval'],['speed','sval']])document.getElementById(a).oninput=e=>document.getElementById(b).textContent=e.target.value+'%';
const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');let sid=null;function setStick(e){let r=stick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),d=Math.max(1,Math.hypot(x,y)),k=Math.min(1,55/d);move.x=x*k/55;move.y=y*k/55;knob.style.transform=`translate(${x*k}px,${y*k}px)`}stick.addEventListener('pointerdown',e=>{sid=e.pointerId;stick.setPointerCapture(sid);setStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)setStick(e)});function clear(e){if(e.pointerId===sid){sid=null;move={x:0,y:0};knob.style.transform=''}}stick.addEventListener('pointerup',clear);stick.addEventListener('pointercancel',clear);let lookId=null,px=0,py=0;renderer.domElement.addEventListener('pointerdown',e=>{if(lookId===null){lookId=e.pointerId;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(lookId)}});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;let dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;yaw-=dx*.005;pitch=Math.max(-.25,Math.min(.9,pitch+dy*.004))});renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===lookId)lookId=null});renderer.domElement.addEventListener('pointercancel',e=>{if(e.pointerId===lookId)lookId=null});const keys=new Set();addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='Space'&&grounded){vy=7/Math.sqrt(Math.max(.15,gravity));grounded=false}});addEventListener('keyup',e=>keys.delete(e.code));setInterval(()=>{if(sid!==null)return;move.x=Number(keys.has('KeyD')||keys.has('ArrowRight'))-Number(keys.has('KeyA')||keys.has('ArrowLeft'));move.y=Number(keys.has('KeyS')||keys.has('ArrowDown'))-Number(keys.has('KeyW')||keys.has('ArrowUp'))},30);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
