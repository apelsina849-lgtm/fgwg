# Run from shreksich-deploy/; copy .env.sale.example to .env.sale and fill values.
services:
  shreksich:
    build: .
    restart: unless-stopped
    env_file: .env.sale
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - shreksich_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 60s
volumes:
  shreksich_data:
